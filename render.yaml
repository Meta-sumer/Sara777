# Render Blueprint — Sara777
#
#   sara777-api    Node web service: the Express API. Also serves the admin panel
#                  at /admin, so the panel stays reachable even if the static site
#                  below is removed.
#   sara777-admin  The same admin/ folder published as its own static site, on its
#                  own URL. Static sites do not spin down, so the panel opens
#                  instantly; its API calls still wake the API service.
#
# The mobile app is not deployed here; it is built into an APK.
#
# NOTE: sara777-api is on the free plan, meant for testing.
# Free services get no persistent disk and spin down after ~15 minutes of no traffic,
# so server/data/matka.db is wiped on every deploy, restart and cold start —
# registered users, bids, wallets and fund requests do not survive.
# The seeder repopulates markets, games and past results on each boot.
# To keep data, switch to `plan: starter` and add back the disk block documented
# at the bottom of this file.

services:
  - type: web
    name: sara777-api
    runtime: node
    plan: free
    region: singapore      # closest Render region to India
    branch: main
    rootDir: server        # db.ts and uploads.ts resolve paths from process.cwd()
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/settings
    autoDeploy: true

    # Only rebuild when the API or the admin panel changes, not on mobile-only commits.
    buildFilter:
      paths:
        - server/**
        - admin/**
        - render.yaml

    envVars:
      # node:sqlite (DatabaseSync) needs Node 22.5+; 24 matches local development.
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      # Set these in the Render dashboard. If left blank the code falls back to
      # admin / admin123 and the panel at /admin is wide open to the internet.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTO_DECLARE
        value: "1"
      - key: REGISTER_BONUS
        value: "1000"

  - type: web
    name: sara777-admin
    runtime: static
    branch: main
    staticPublishPath: admin
    autoDeploy: true

    # admin/config.js ships with an empty origin, which means "same origin" and is
    # what the API-served copy at /admin needs. A standalone site is a different
    # origin, so point it at the API here. Auth is a bearer token in localStorage,
    # not a cookie, and the API already sends permissive CORS headers.
    buildCommand: 'echo "window.ADMIN_API_ORIGIN = ''https://sara777-api.onrender.com'';" > admin/config.js'

    buildFilter:
      paths:
        - admin/**
        - render.yaml

# To make the API's data persistent later: set `plan: starter` on sara777-api and
# add this under that service. The mount path must equal <rootDir>/data, because
# db.ts uses path.resolve(process.cwd(), 'data').
#
#    disk:
#      name: sara777-data
#      mountPath: /opt/render/project/src/server/data
#      sizeGB: 1
