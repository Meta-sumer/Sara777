# Rama777 (rama777.tech): Node API + admin panel on 127.0.0.1:4100, systemd unit "rama777".
# Managed by hand, not through aaPanel. Certificate: acme.sh (Let us Encrypt), renewed by root cron.
server
{
    listen 80;
    listen [::]:80;
    server_name rama777.tech www.rama777.tech;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/rama777.tech;
    }
    location / {
        return 301 https://rama777.tech$request_uri;
    }
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rama777.tech www.rama777.tech;

    ssl_certificate /www/server/panel/vhost/cert/rama777.tech/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/rama777.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # www → bare domain
    if ($host = www.rama777.tech) {
        return 301 https://rama777.tech$request_uri;
    }

    client_max_body_size 10m;

    # Android app download: https://rama777.tech/download/Rama777.apk
    location /download/ {
        root /www/wwwroot/rama777.tech;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    access_log /www/wwwlogs/rama777.tech.log;
    error_log /www/wwwlogs/rama777.tech.error.log;
}
